name: Auto Goal wake

# Wakes the repository-attached Claude routine that runs the Auto Goal runner, when something the
# goal waits for happens: Codex finishes a review (or says it cannot), the required checks on the
# PR's current commit complete, or a goal issue is labelled `auto-goal` by the trusted login.
#
# Every trigger below is one GitHub runs from the default branch, so a goal branch (which the agent
# writes to) can never change this file's behaviour. The job checks out only the default branch,
# runs one dependency-free script, and never executes PR code. The routine token is used only in
# the fire request and is never printed.
#
# Before each call the job posts a wake ticket on the goal's issue and sends the routine only that
# ticket's id; the routine's guard reads the ticket back and runs that goal and no other. If every
# call fails, the job fails and the retry job below calls again for the same ticket.
#
# The scheduled watchdog job only reads, unless a goal is provably stalled: no live run or claim,
# no wake in flight, not waiting on Codex or CI, and quiet for longer than an owner's lease. Then
# it posts one recovery ticket for that stall and wakes the routine (at most 3 per goal). The decision logic and its tests are in
# artifacts/SpecSmith/scripts/auto-goal/wake.mjs and wake.test.ts.

on:
  issue_comment:
    types: [created, edited]
  workflow_run:
    workflows: ["Verify pull request"]
    types: [completed]
  check_suite:
    types: [completed]
  issues:
    types: [labeled]
  # The fallback for an owner that died without leaving an event (see the watchdog job). Every 15
  # minutes, off the hour. Free on this public repository; GitHub may start it late, and turns
  # schedules off after 60 days without repository activity.
  schedule:
    - cron: '4,19,34,49 * * * *'

permissions:
  # Also lets the watchdog read run-claim branches and their commits.
  contents: read
  pull-requests: read
  checks: read
  # Wake tickets: one comment per wake on the goal's issue, updated with the call's outcome.
  issues: write

# One wake decision at a time across the repository, so two deliveries never both see "no run yet".
concurrency:
  group: auto-goal-wake
  cancel-in-progress: false

jobs:
  wake:
    name: Wake the Auto Goal runner
    if: >-
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && github.event.comment.user.login == 'chatgpt-codex-connector[bot]')
      || github.event_name == 'workflow_run'
      || github.event_name == 'check_suite'
      || (github.event_name == 'issues' && github.event.label.name == 'auto-goal')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the default branch only (never PR code)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: artifacts/SpecSmith/scripts/auto-goal/wake.mjs
          sparse-checkout-cone-mode: false

      - name: Decide and wake
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AUTO_GOAL_TRUSTED_LOGIN: ${{ vars.AUTO_GOAL_TRUSTED_LOGIN }}
          AUTO_GOAL_ROUTINE_FIRE_URL: ${{ secrets.AUTO_GOAL_ROUTINE_FIRE_URL }}
          AUTO_GOAL_ROUTINE_TOKEN: ${{ secrets.AUTO_GOAL_ROUTINE_TOKEN }}
        working-directory: artifacts/SpecSmith
        run: node scripts/auto-goal/wake.mjs event

  retry:
    name: Retry a failed wake
    needs: wake
    if: ${{ always() && needs.wake.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out the default branch only (never PR code)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: artifacts/SpecSmith/scripts/auto-goal/wake.mjs
          sparse-checkout-cone-mode: false

      - name: Wait, then call again for tickets whose call failed
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AUTO_GOAL_TRUSTED_LOGIN: ${{ vars.AUTO_GOAL_TRUSTED_LOGIN }}
          AUTO_GOAL_ROUTINE_FIRE_URL: ${{ secrets.AUTO_GOAL_ROUTINE_FIRE_URL }}
          AUTO_GOAL_ROUTINE_TOKEN: ${{ secrets.AUTO_GOAL_ROUTINE_TOKEN }}
        working-directory: artifacts/SpecSmith
        run: node scripts/auto-goal/wake.mjs retry

  watchdog:
    name: Recover a stalled goal
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the default branch only (never PR code)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: artifacts/SpecSmith/scripts/auto-goal/wake.mjs
          sparse-checkout-cone-mode: false

      - name: Wake only a goal whose owner provably died
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AUTO_GOAL_TRUSTED_LOGIN: ${{ vars.AUTO_GOAL_TRUSTED_LOGIN }}
          AUTO_GOAL_ROUTINE_FIRE_URL: ${{ secrets.AUTO_GOAL_ROUTINE_FIRE_URL }}
          AUTO_GOAL_ROUTINE_TOKEN: ${{ secrets.AUTO_GOAL_ROUTINE_TOKEN }}
        working-directory: artifacts/SpecSmith
        run: node scripts/auto-goal/wake.mjs watchdog
