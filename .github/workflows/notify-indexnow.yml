name: Notify IndexNow of changed pages

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type notify to authorize an IndexNow crawl notification'
        required: true
        type: string
      scope:
        description: 'Changed/new URLs, or every canonical sitemap URL for initial setup'
        required: true
        default: changed
        type: choice
        options:
          - changed
          - all

permissions:
  contents: read

concurrency:
  group: notify-indexnow
  cancel-in-progress: false

jobs:
  notify:
    if: github.event_name == 'schedule' || inputs.confirm == 'notify'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the exact triggering commit with history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and verify the canonical sitemap
        working-directory: artifacts/SpecSmith
        run: |
          set -euo pipefail
          pnpm exec vitest run scripts/search-indexing/core.test.ts scripts/search-indexing/clients.test.ts
          pnpm run build

      - name: Select only new or meaningfully changed canonical URLs
        id: select
        env:
          REQUESTED_SCOPE: ${{ inputs.scope || 'changed' }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/indexnow"
          if [ "${{ github.event_name }}" = 'schedule' ]; then
            baseline="$(git rev-list -1 --before='36 hours ago' HEAD || true)"
          else
            baseline="$(git rev-parse HEAD^ 2>/dev/null || true)"
          fi
          if [ -n "${baseline}" ]; then
            git show "${baseline}:artifacts/SpecSmith/public/sitemap.xml" > "${RUNNER_TEMP}/indexnow/previous.xml" 2>/dev/null || :
            git diff --name-only "${baseline}" HEAD > "${RUNNER_TEMP}/indexnow/changed-files.txt"
          else
            : > "${RUNNER_TEMP}/indexnow/previous.xml"
            git ls-tree -r --name-only HEAD > "${RUNNER_TEMP}/indexnow/changed-files.txt"
          fi
          extra=()
          if [ "${REQUESTED_SCOPE}" = 'all' ]; then extra+=(--all); fi
          cd artifacts/SpecSmith
          node --import tsx scripts/search-indexing/select-indexnow-urls.ts \
            --current dist/public/sitemap.xml \
            --previous "${RUNNER_TEMP}/indexnow/previous.xml" \
            --changed-files "${RUNNER_TEMP}/indexnow/changed-files.txt" \
            --out "${RUNNER_TEMP}/indexnow/urls.txt" \
            "${extra[@]}"
          node scripts/submit-indexnow.mjs \
            --sitemap dist/public/sitemap.xml \
            --urls-file "${RUNNER_TEMP}/indexnow/urls.txt" \
            --dry-run

      - name: Notify IndexNow
        working-directory: artifacts/SpecSmith
        run: |
          set -euo pipefail
          node scripts/submit-indexnow.mjs \
            --sitemap dist/public/sitemap.xml \
            --urls-file "${RUNNER_TEMP}/indexnow/urls.txt"

      - name: Confirm the repository was not modified
        if: always()
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
