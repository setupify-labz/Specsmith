name: Content Asset Rights CI

on:
  push:
    branches:
      - chatgpt/content-asset-rights-v1
      - claude/meshy-ingestion-v1
      - chatgpt/meshy-ingestion-hardening-v1
      - chatgpt/hashtag-publishing-logic-v1
      - chatgpt/social-publisher-learning-v1
      - claude/pr56-audit-fixes-v1
  pull_request:
    branches:
      - chatgpt/hashtag-publishing-logic-v1
      - claude/meshy-ingestion-v1
      - chatgpt/content-asset-rights-v1
      - chatgpt/elevenlabs-video-v1
      - chatgpt/content-automator-v1
      - main

jobs:
  test-content-automator:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test rights, publishing, analytics, and production integration
        run: >-
          pnpm --dir artifacts/SpecSmith exec vitest run
          scripts/content-automator/assetRights.test.ts
          scripts/content-automator/productVisualAssets.test.ts
          scripts/content-automator/meshyIngestion.test.ts
          scripts/content-automator/meshyIngestCli.test.ts
          scripts/content-automator/productionPlan.test.ts
          scripts/content-automator/hashtags.test.ts
          scripts/content-automator/creativeFingerprint.test.ts
          scripts/content-automator/publishing.test.ts
          scripts/content-automator/analyticsIngestion.test.ts
          scripts/content-automator/performance.test.ts
          scripts/content-automator/logicalAutomator.test.ts

      - name: Run full SpecSmith test suite
        run: pnpm --dir artifacts/SpecSmith test

      - name: Typecheck SpecSmith
        run: pnpm --dir artifacts/SpecSmith typecheck
