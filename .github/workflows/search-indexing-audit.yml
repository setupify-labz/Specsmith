name: Search indexing audit

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type audit to authorize read-only Google and Bing API calls'
        required: true
        type: string
      manual_request_limit:
        description: 'Maximum Google URLs to place in the manual request queue'
        required: true
        default: '10'
        type: choice
        options:
          - '5'
          - '10'
          - '20'

permissions:
  contents: read

concurrency:
  group: search-indexing-audit
  cancel-in-progress: false

jobs:
  audit:
    if: inputs.confirm == 'audit'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the exact triggering commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify the audit boundary before contacting either provider
        working-directory: artifacts/SpecSmith
        run: |
          set -euo pipefail
          pnpm typecheck
          pnpm exec vitest run scripts/search-indexing/core.test.ts scripts/search-indexing/clients.test.ts scripts/retail/coverage/workflowSafety.test.ts
          pnpm run build

      - name: Read Search Console and Bing Webmaster diagnostics
        working-directory: artifacts/SpecSmith
        env:
          GOOGLE_SEARCH_CONSOLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SEARCH_CONSOLE_SERVICE_ACCOUNT_JSON }}
          BING_WEBMASTER_API_KEY: ${{ secrets.BING_WEBMASTER_API_KEY }}
          GOOGLE_SEARCH_CONSOLE_SITE_URL: ${{ vars.GOOGLE_SEARCH_CONSOLE_SITE_URL }}
          MANUAL_REQUEST_LIMIT: ${{ inputs.manual_request_limit }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "${RUNNER_TEMP}/search-indexing-audit"
          node --import tsx scripts/search-indexing/audit.ts \
            --sitemap dist/public/sitemap.xml \
            --out "${RUNNER_TEMP}/search-indexing-audit" \
            --manual-limit "${MANUAL_REQUEST_LIMIT}"

      - name: Upload the indexing report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: search-indexing-audit-${{ github.run_id }}
          path: ${{ runner.temp }}/search-indexing-audit/
          if-no-files-found: error
          retention-days: 7

      - name: Confirm the repository was not modified
        if: always()
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
