# Photographs the builder in an environment where the retailer image CDN is
# actually reachable.
#
# WHY A WORKFLOW AND NOT A LOCAL SCREENSHOT
# -----------------------------------------
# The development sandbox blocks c1.neweggimages.com, so every product card
# there paints the "No image" placeholder. Screenshots taken in it are
# indistinguishable from screenshots of a page whose image pipeline is broken,
# which makes them useless as evidence that the image experience works. A
# GitHub runner has ordinary outbound access, so the same build photographed
# here shows what a visitor sees, and the run reports the share of cards whose
# <img> actually decoded rather than leaving it to the eye.
#
# WHAT THIS JOB IS ALLOWED TO TOUCH
# ---------------------------------
# It has `contents: write` for exactly one reason: the screenshots have to
# leave the runner, and a branch is the only channel that survives. It pushes
# to SCREENSHOT_BRANCH and nothing else — the publish step refuses if anything
# outside `screenshots/` is staged, and refuses to push to any other ref. It
# references no secret, mints no token, contacts no retailer API and never
# touches the default branch or a deployment. That is asserted structurally by
# scripts/ui/screenshotWorkflowSafety.test.ts, which reads this file.

name: Capture builder UI screenshots

# The push trigger is narrow on purpose: only the working branch, and only the
# four paths that can change what the builder looks like. A dispatch-only
# workflow is not dispatchable until its file reaches the default branch, and
# this one is being written on a feature branch that is deliberately not
# merged yet.
on:
  push:
    branches:
      - claude/rakuten-newegg-adapter-97h85y
    paths:
      - '.github/workflows/capture-ui-screenshots.yml'
      - 'artifacts/SpecSmith/scripts/ui/**'
      - 'artifacts/SpecSmith/src/components/builder/**'
      - 'artifacts/SpecSmith/src/pages/Builder.tsx'
  workflow_dispatch:
    inputs:
      before_ref:
        description: 'Commit to photograph as the "before" state'
        required: false
        default: '619d40e'

permissions:
  contents: write

concurrency:
  group: ui-screenshots
  cancel-in-progress: true

env:
  # The published-screenshots branch. Not the working branch, not the default
  # branch: a dead-end ref that holds images and nothing else.
  SCREENSHOT_BRANCH: claude/ui-screenshots-97h85y
  AFTER_PORT: '4319'
  BEFORE_PORT: '4320'
  PLAYWRIGHT_VERSION: 1.56.1

jobs:
  capture:
    name: Build, serve and photograph the builder
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # Full history: the "before" state is built from an older commit in a
      # worktree, so a shallow clone would not contain it.
      - name: Check out the exact triggering commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Playwright is installed OUTSIDE the workspace, on purpose. This job is
      # the only thing that needs a browser driver; adding it to the app's
      # devDependencies would put a 100MB tool in every contributor's install
      # and in the lockfile the deployment reads.
      - name: Install Playwright and Chromium
        run: |
          set -euo pipefail
          npm install --no-save --prefix "${RUNNER_TEMP}/pw" "playwright@${PLAYWRIGHT_VERSION}"
          "${RUNNER_TEMP}/pw/node_modules/.bin/playwright" install --with-deps chromium

      - name: Build the current commit
        working-directory: artifacts/SpecSmith
        run: pnpm run build

      - name: Serve the current build
        working-directory: artifacts/SpecSmith
        run: |
          set -euo pipefail
          PORT="${AFTER_PORT}" nohup pnpm run serve > "${RUNNER_TEMP}/after-serve.log" 2>&1 &
          for _ in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:${AFTER_PORT}/builder" > /dev/null; then
              echo "serving on ${AFTER_PORT}"
              exit 0
            fi
            sleep 2
          done
          echo "the preview server never came up"
          cat "${RUNNER_TEMP}/after-serve.log"
          exit 1

      - name: Photograph the redesigned builder and measure image loading
        working-directory: artifacts/SpecSmith
        env:
          BASE_URL: http://127.0.0.1:4319
          OUT_DIR: ${{ github.workspace }}/screenshots
          LABEL: after
          MEASURE: '1'
        run: |
          set -euo pipefail
          PLAYWRIGHT_REQUIRE_FROM="${RUNNER_TEMP}/pw/node_modules/" \
            node scripts/ui/captureBuilderScreenshots.mjs

      # The "before" state, built the same way from the commit that still had
      # the accordion. Photographed in the same run, on the same runner, at the
      # same viewports, so the comparison is not confounded by the environment.
      - name: Build and photograph the previous interface
        env:
          BASE_URL: http://127.0.0.1:4320
          OUT_DIR: ${{ github.workspace }}/screenshots
          LABEL: before
          MEASURE: '0'
          # Through the environment, never interpolated into the script body:
          # a dispatch input is text, and text spliced into a shell line is a
          # command someone else got to write.
          BEFORE_REF: ${{ inputs.before_ref || '619d40e' }}
        run: |
          set -euo pipefail
          before="${RUNNER_TEMP}/before"
          git worktree add --detach "${before}" "${BEFORE_REF}"
          cd "${before}"
          pnpm install --frozen-lockfile
          cd "${before}/artifacts/SpecSmith"
          pnpm run build
          PORT="${BEFORE_PORT}" nohup pnpm run serve > "${RUNNER_TEMP}/before-serve.log" 2>&1 &
          for _ in $(seq 1 60); do
            curl -fsS "http://127.0.0.1:${BEFORE_PORT}/builder" > /dev/null && break
            sleep 2
          done
          PLAYWRIGHT_REQUIRE_FROM="${RUNNER_TEMP}/pw/node_modules/" \
            node "${GITHUB_WORKSPACE}/artifacts/SpecSmith/scripts/ui/captureBuilderScreenshots.mjs"

      - name: Summarise image loading per category
        run: |
          set -euo pipefail
          node --input-type=module -e '
            import fs from "node:fs";
            const report = JSON.parse(fs.readFileSync(process.env.GITHUB_WORKSPACE + "/screenshots/image-report.json", "utf-8"));
            const rows = Object.entries(report.categories);
            const lines = ["| category | cards | images loaded | rate | placeholders | collapsed | stretched | tiny |", "| --- | --- | --- | --- | --- | --- | --- | --- |"];
            let worst = 1;
            for (const [name, m] of rows) {
              const rate = m.cards === 0 ? 1 : m.loaded / m.cards;
              worst = Math.min(worst, rate);
              lines.push(`| ${name} | ${m.cards} | ${m.loaded} | ${(rate * 100).toFixed(1)}% | ${m.placeholders} | ${m.collapsed} | ${m.stretched} | ${m.tiny} |`);
            }
            lines.push("", "Layout: " + JSON.stringify(report.layout));
            lines.push("", "| width | header controls | clipped | wrapped | page overflow |", "| --- | --- | --- | --- | --- |");
            for (const [width, h] of Object.entries(report.header ?? {})) {
              lines.push(`| ${width}px | ${h.visibleControls} | ${h.clippedControls} | ${h.wrappedControls} | ${h.horizontalOverflowPx}px |`);
            }
            lines.push("", "| category | products measured | smallest drawn | median | largest | spread | drawn small | heavily padded |", "| --- | --- | --- | --- | --- | --- | --- | --- |");
            const pct = (v) => (v === null || v === undefined ? "n/a" : `${(v * 100).toFixed(0)}%`);
            for (const [name, s] of Object.entries(report.productSpans ?? {})) {
              lines.push(`| ${name} | ${s.measured} | ${pct(s.min)} | ${pct(s.median)} | ${pct(s.max)} | ${pct(s.spread)} | ${s.smallProducts} | ${s.heavilyPadded} |`);
            }
            if (report.mobileCard) lines.push("", "Mobile card: " + JSON.stringify(report.mobileCard));
            lines.push("", `Worst category image rate: ${(worst * 100).toFixed(1)}%`);
            const text = lines.join("\n") + "\n";
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, text);
            console.log(text);
            fs.writeFileSync(process.env.GITHUB_WORKSPACE + "/screenshots/image-report.md", text);
          '

      - name: Publish the screenshots to the screenshot branch
        env:
          GH_PUSH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}"
          # A detached, single-commit history: this branch is a delivery
          # channel for images, never a base anything is built on.
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout --orphan publish-screenshots
          git rm -rq --cached . || true
          git add -f -- screenshots
          if [ -n "$(git diff --cached --name-only | grep -v '^screenshots/' || true)" ]; then
            echo "Refusing to publish: something outside screenshots/ is staged."
            git diff --cached --name-only
            exit 1
          fi
          git commit -m "UI screenshots for ${GITHUB_SHA}"
          git push --force \
            "https://x-access-token:${GH_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/${SCREENSHOT_BRANCH}"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Screenshots pushed to \`${SCREENSHOT_BRANCH}\` for commit \`${GITHUB_SHA}\`." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the screenshots as a run artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: builder-screenshots
          path: screenshots
          retention-days: 7

      # Last, so the evidence is published even when the number is bad: a
      # failing rate is a thing to diagnose from the screenshots, not a reason
      # to throw them away.
      - name: Check images, header fit and how large products are actually drawn
        run: |
          set -euo pipefail
          node --input-type=module -e '
            import fs from "node:fs";
            const report = JSON.parse(fs.readFileSync(process.env.GITHUB_WORKSPACE + "/screenshots/image-report.json", "utf-8"));
            const failures = [];

            const belowRate = Object.entries(report.categories).filter(([, m]) => m.cards > 0 && m.loaded / m.cards < 0.95);
            if (belowRate.length > 0) failures.push("below the 95% image threshold: " + belowRate.map(([n]) => n).join(", "));

            for (const [width, h] of Object.entries(report.header ?? {})) {
              if (h.clippedControls > 0) failures.push(`header control clipped at ${width}px`);
              if (h.wrappedControls > 0) failures.push(`header control wrapped onto two lines at ${width}px`);
              if (h.horizontalOverflowPx > 0) failures.push(`page scrolls sideways at ${width}px`);
            }

            for (const [name, l] of Object.entries(report.layout ?? {})) {
              if (l.horizontalOverflowPx > 0) failures.push(`page scrolls sideways at ${name}`);
              if (l.nestedCatalogScrollers > 0) failures.push(`nested catalogue scroller at ${name}`);
            }

            // Products drawn far smaller than their neighbours. This is the
            // check that an <img> measurement cannot make: it reads the
            // picture, not the element, so a product floating in white is
            // caught even though its element is exactly the right size.
            for (const [name, s] of Object.entries(report.productSpans ?? {})) {
              if (s.measured === 0) continue;
              if (s.smallProducts / s.measured > 0.15) {
                failures.push(`${name}: ${s.smallProducts}/${s.measured} products drawn under half their frame`);
              }
            }

            if (failures.length > 0) {
              console.error("Visual checks failed:");
              for (const failure of failures) console.error(" - " + failure);
              process.exit(1);
            }
            console.log("Images, header fit and product framing all within thresholds.");
          '
