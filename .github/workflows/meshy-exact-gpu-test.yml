name: Meshy Exact GPU Test

on:
  push:
    branches:
      - chatgpt/elevenlabs-video-v1
  pull_request:
    branches:
      - chatgpt/content-automator-v1
    types:
      - synchronize
      - edited

jobs:
  exact-gpu-test:
    if: ${{ (github.event_name == 'push' && contains(github.event.head_commit.message, '[live-meshy-3d]')) || (github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[live-meshy-3d]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate consistent multi-view references from NVIDIA press image
        env:
          MESHY_API_KEY: ${{ secrets.MESHY_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$MESHY_API_KEY" ]; then
            echo "MESHY_API_KEY is not available." >&2
            exit 1
          fi
          echo "ready"
