name: Regenerate lockfile for dependency cleanup

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  regenerate:
    if: github.head_ref == 'cleanup/remove-replit-dependencies'
    runs-on: ubuntu-latest
    steps:
      - name: Check out cleanup branch
        uses: actions/checkout@v4
        with:
          ref: cleanup/remove-replit-dependencies

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate

      - name: Regenerate pnpm lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Remove one-shot workflow and verify cleanup
        run: |
          rm .github/workflows/cleanup-lockfile.yml
          if git grep -ni 'replit' -- ':!*.png' ':!*.jpg' ':!*.jpeg' ':!*.webp'; then
            echo 'Legacy Replit references remain after cleanup.' >&2
            exit 1
          fi

      - name: Commit regenerated lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml .github/workflows/cleanup-lockfile.yml
          if git diff --cached --quiet; then
            echo 'No lockfile changes to commit.'
            exit 0
          fi
          git commit -m 'Regenerate lockfile after Replit dependency cleanup'
          git push origin HEAD:cleanup/remove-replit-dependencies
