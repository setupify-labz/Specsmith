name: Verify pull request

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tests, typecheck and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the exact pull-request head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Prove the exact commit under test
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "Expected: ${EXPECTED_HEAD}"
          echo "Checked out: ${actual}"
          test "${actual}" = "${EXPECTED_HEAD}"
          echo "Exact head verified: \`${actual}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Run full test suite
        working-directory: artifacts/SpecSmith
        run: pnpm exec vitest run

      - name: Build and prerender production application
        working-directory: artifacts/SpecSmith
        run: pnpm run build

      - name: Confirm verification did not modify the repository
        if: always()
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain)" ]; then
            echo "Verification modified the working tree:"
            git status --porcelain
            exit 1
          fi
          echo "Working tree clean."
