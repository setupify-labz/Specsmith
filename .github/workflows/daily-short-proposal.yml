# Daily Short proposal — MANUAL TRIGGER ONLY.
#
# Runs dailyShortProposal/run.ts on a channel-metrics snapshot already committed
# to the repository (collected through the Metricool and vidIQ connectors; see
# artifacts/SpecSmith/scripts/content-automator/dailyShortProposal/README.md),
# and uploads the proposal folder for human review.
#
#   - workflow_dispatch only: no schedule, push or pull_request trigger.
#   - No secrets: it reads a file, renders a silent preview, and stops. It calls
#     no paid provider, generates no voice, schedules nothing, publishes nothing.
#   - It fails if the snapshot is missing, stale or lacks a needed source, or if
#     Chromium or ffmpeg is unavailable.
#
# GitHub only dispatches workflows on the default branch, so this becomes
# runnable after merge; until then run the same command locally.
name: Daily Short proposal (manual)

on:
  workflow_dispatch:
    inputs:
      snapshot:
        description: 'Snapshot path, relative to artifacts/SpecSmith (e.g. scripts/content-automator/dailyShortProposal/snapshots/2026-10-11.json)'
        required: true
      max_age_hours:
        description: 'Refuse a snapshot older than this many hours'
        required: true
        default: '36'

permissions:
  contents: read

concurrency:
  group: daily-short-proposal
  cancel-in-progress: false

jobs:
  propose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install ffmpeg
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install Playwright Chromium
        working-directory: artifacts/SpecSmith
        run: pnpm exec playwright install --with-deps chromium

      - name: Propose one Short
        working-directory: artifacts/SpecSmith
        env:
          SNAPSHOT: ${{ inputs.snapshot }}
          MAX_AGE_HOURS: ${{ inputs.max_age_hours }}
        run: |
          set -euo pipefail
          case "$MAX_AGE_HOURS" in ''|*[!0-9]*) echo "::error::max_age_hours must be a whole number."; exit 1;; esac
          pnpm exec tsx scripts/content-automator/dailyShortProposal/run.ts --snapshot "$SNAPSHOT" --max-age-hours "$MAX_AGE_HOURS" --out render-output/daily-proposal

      - name: Upload the proposal for review
        if: ${{ always() && hashFiles('artifacts/SpecSmith/render-output/daily-proposal/*') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: daily-short-proposal
          path: artifacts/SpecSmith/render-output/daily-proposal/
          retention-days: 30
