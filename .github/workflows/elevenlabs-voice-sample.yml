# Opt-in exact Compare narration with Liam — MANUAL TRIGGER ONLY.
#
# This is the only workflow in this repository that spends a paid provider's
# credits, so it is deliberately hard to run by accident:
#
#   - `workflow_dispatch` only. No push, pull_request, or schedule trigger.
#   - The operator must type the word `generate` to confirm.
#   - It generates ONE approved narration and stops: the Compare video's
#     (`script: compare-video`, the default) or the GPU race draft's five lines
#     (`script: gpu-race`), or the RAM-fit pilot's five lines (`script: ram-fit`).
#     Each refuses before any spend unless its text is the approved script and
#     SpecSmith still computes or checks what it states (Compare's figures; the
#     Builder's RAM verdict and both fixes for ram-fit).
#     `fps-20-wins` generates ONE Liam take of the approved "20 wins, only 4
#     FPS apart" script, after recomputing every figure it speaks from the
#     Compare model; a second job, with no provider secret, posts the take to
#     the review PR named in `review_pr` so it can be timed and rendered.
#     `ram-fit-saved-take` spends nothing: it renders the RAM-fit pilot again
#     from the ONE paid take of run 37086531999, after checking that run, its
#     artifact digest and the take's audio hash, in a job that holds no secret.
#     `list-voices` lists the account's voices and spends nothing;
#     `voice-audition` reads the race's last three approved lines once in each
#     of two named voices, for choosing by ear (never as approved narration).
#   - The script reads the subscription first and refuses if the sample would
#     exceed the included allowance, or if the account can extend its limit
#     (which would turn an overage into a bill).
#
# The job holding the key never renders a video, never publishes, and never
# falls back to the local espeak fixture: if generation fails, the job fails
# with the reason. For `gpu-race` a SECOND job, with no secrets and read-only
# permissions, retimes the draft to the take and renders it for review. It
# refuses a take that cannot fit the draft's 12-15 second cut. `ram-fit` works
# the same way: its second job holds no secret, times the picture-locked cut to
# the take, renders the 1080x1920 MP4 for a person to watch, and publishes
# nothing.
#
# Every action is pinned to a commit SHA rather than a moving tag, as in every
# other workflow here. A tag can be repointed by whoever controls the action's
# repository, and this job holds a paid API key while it runs.
name: Compare Liam narration (manual)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "generate" to confirm spending included ElevenLabs credits'
        required: true
        default: ''
      script:
        description: 'Which approved narration to generate'
        required: true
        type: choice
        default: compare-video
        options:
          - compare-video
          - gpu-race
          - ram-fit
          - ram-fit-saved-take
          - fps-20-wins
          - list-voices
          - voice-audition
      review_pr:
        description: 'fps-20-wins only: the draft PR number the take is posted to for review'
        required: false
        default: ''
      audition_voice_ids:
        description: 'voice-audition only: exactly two voice ids, comma separated (list-voices prints them)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  # One narration at a time. Overlapping runs would spend credits twice for the
  # same decision.
  group: elevenlabs-voice-sample
  cancel-in-progress: false

jobs:
  sample:
    # The saved-take render needs no provider and must not touch the key.
    if: inputs.script != 'ram-fit-saved-take'
    runs-on: ubuntu-latest
    # A stuck run on the one workflow that spends a provider's credits should
    # end by itself. Install plus one short narration is minutes, not tens.
    timeout-minutes: 10
    steps:
      - name: Require explicit confirmation
        if: inputs.confirm != 'generate'
        run: |
          echo "::error::Refusing to run. Re-dispatch with confirm set to exactly: generate"
          exit 1

      - name: Require the API key to be configured as a secret
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          # Presence check only. The value is never echoed, and GitHub masks it
          # in logs regardless.
          if [ -z "${ELEVENLABS_API_KEY}" ]; then
            echo "::error::ELEVENLABS_API_KEY is not configured for this repository."
            exit 1
          fi
          echo "ELEVENLABS_API_KEY is configured (value not printed)."

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # This job reads a paid provider's key. It has no reason to also
          # carry a token that can push to the repository.
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate the exact Compare narration with Liam
        if: inputs.script == 'compare-video'
        working-directory: artifacts/SpecSmith
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: TX3LPaxmHKxFdv7VOQHJ
          # Optional overrides; all have safe defaults in the adapter.
          ELEVENLABS_MODEL_ID: ${{ vars.ELEVENLABS_MODEL_ID }}
          ELEVENLABS_OUTPUT_FORMAT: ${{ vars.ELEVENLABS_OUTPUT_FORMAT }}
        run: pnpm exec tsx scripts/content-automator/elevenLabsVoiceSample.ts

      - name: Generate one Liam take of the GPU race draft
        if: inputs.script == 'gpu-race'
        working-directory: artifacts/SpecSmith
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: TX3LPaxmHKxFdv7VOQHJ
          ELEVENLABS_MODEL_ID: ${{ vars.ELEVENLABS_MODEL_ID }}
          ELEVENLABS_OUTPUT_FORMAT: ${{ vars.ELEVENLABS_OUTPUT_FORMAT }}
        run: pnpm exec tsx scripts/content-automator/gpuRacePoc/liamTake.ts

      - name: Upload the GPU race take
        if: inputs.script == 'gpu-race'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: specsmith-gpu-race-liam-take
          path: artifacts/SpecSmith/render-output/liam-take/
          if-no-files-found: error
          retention-days: 14

      - name: Generate one Liam take of the RAM-fit pilot
        if: inputs.script == 'ram-fit'
        working-directory: artifacts/SpecSmith
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: TX3LPaxmHKxFdv7VOQHJ
          ELEVENLABS_MODEL_ID: ${{ vars.ELEVENLABS_MODEL_ID }}
          ELEVENLABS_OUTPUT_FORMAT: ${{ vars.ELEVENLABS_OUTPUT_FORMAT }}
        run: pnpm exec tsx scripts/content-automator/pilotRamFit/liamTake.ts

      - name: Upload the RAM-fit take
        if: inputs.script == 'ram-fit'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: specsmith-ram-fit-liam-take
          path: artifacts/SpecSmith/render-output/ram-fit-liam-take/
          if-no-files-found: error
          retention-days: 14

      - name: Generate one Liam take of the FPS Short
        if: inputs.script == 'fps-20-wins'
        working-directory: artifacts/SpecSmith
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: TX3LPaxmHKxFdv7VOQHJ
          ELEVENLABS_MODEL_ID: ${{ vars.ELEVENLABS_MODEL_ID }}
          ELEVENLABS_OUTPUT_FORMAT: ${{ vars.ELEVENLABS_OUTPUT_FORMAT }}
        run: pnpm exec tsx scripts/content-automator/fpsWinsPoc/liamTake.ts

      - name: Upload the FPS take
        if: inputs.script == 'fps-20-wins'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: specsmith-fps-20-wins-liam-take
          path: artifacts/SpecSmith/render-output/fps-20-wins-liam-take/
          if-no-files-found: error
          retention-days: 14

      - name: List the account's voices (no audio, no spend)
        if: inputs.script == 'list-voices'
        working-directory: artifacts/SpecSmith
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: TX3LPaxmHKxFdv7VOQHJ
        run: pnpm exec tsx scripts/content-automator/gpuRacePoc/voiceAuditions.ts list

      - name: Generate one audition per chosen voice
        if: inputs.script == 'voice-audition'
        working-directory: artifacts/SpecSmith
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: TX3LPaxmHKxFdv7VOQHJ
          ELEVENLABS_MODEL_ID: ${{ vars.ELEVENLABS_MODEL_ID }}
          ELEVENLABS_OUTPUT_FORMAT: ${{ vars.ELEVENLABS_OUTPUT_FORMAT }}
          # Passed as data, never interpolated into the shell; the script validates each id.
          AUDITION_VOICE_IDS: ${{ inputs.audition_voice_ids }}
        run: pnpm exec tsx scripts/content-automator/gpuRacePoc/voiceAuditions.ts

      - name: Upload the auditions
        if: inputs.script == 'voice-audition'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: specsmith-voice-auditions
          path: artifacts/SpecSmith/render-output/voice-auditions/
          if-no-files-found: error
          retention-days: 14

      - name: Upload the narration for review
        if: inputs.script == 'compare-video'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: specsmith-compare-liam-narration
          path: |
            artifacts/SpecSmith/render-output/voice-sample/specsmith-compare-liam.mp3
            artifacts/SpecSmith/render-output/voice-sample/specsmith-compare-liam.json
          if-no-files-found: error
          retention-days: 14

  # Retimes the GPU race draft to the take and renders it for review. This job
  # holds no secret and no write permission: it only reads the take the job
  # above uploaded.
  render-gpu-race:
    needs: sample
    if: inputs.script == 'gpu-race'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install ffmpeg and Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -hide_banner -encoders | grep -q ' libx264 ' || { echo "::error::ffmpeg has no libx264 encoder."; exit 1; }
          cd artifacts/SpecSmith && pnpm exec playwright install --with-deps chromium

      - name: Download the take
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: specsmith-gpu-race-liam-take
          path: artifacts/SpecSmith/render-output/liam-take

      - name: Retime the draft to the take and render it
        working-directory: artifacts/SpecSmith
        run: pnpm exec tsx scripts/content-automator/gpuRacePoc/render.ts --liam-take render-output/liam-take

      - name: Upload the draft for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: specsmith-gpu-race-liam-draft
          path: artifacts/SpecSmith/render-output/gpu-race-liam/
          if-no-files-found: error
          retention-days: 14

  # Times the picture-locked RAM-fit cut to the take and renders the final MP4
  # for a person to watch. Like render-gpu-race, this job holds no secret and no
  # write permission: it only reads the take the job above uploaded, and the
  # renderer refuses any take that is not the approved script in pinned Liam.
  render-ram-fit:
    needs: sample
    if: inputs.script == 'ram-fit'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install ffmpeg and Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -hide_banner -encoders | grep -q ' libx264 ' || { echo "::error::ffmpeg has no libx264 encoder."; exit 1; }
          cd artifacts/SpecSmith && pnpm exec playwright install --with-deps chromium

      - name: Build and serve the app for the Builder warning capture
        working-directory: artifacts/SpecSmith
        run: |
          pnpm exec vite build --config vite.config.ts
          nohup pnpm exec vite preview --config vite.config.ts --port 5178 --strictPort > "$RUNNER_TEMP/preview.log" 2>&1 &
          for attempt in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:5178/builder && exit 0
            sleep 1
          done
          echo "::error::The built app did not start; the Builder warning cannot be captured."
          cat "$RUNNER_TEMP/preview.log"
          exit 1

      - name: Download the take
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: specsmith-ram-fit-liam-take
          path: artifacts/SpecSmith/render-output/ram-fit-liam-take

      - name: Time the locked cut to the take and render the final MP4
        working-directory: artifacts/SpecSmith
        env:
          SPECSMITH_RENDER_BASE_URL: http://localhost:5178
        run: pnpm exec tsx scripts/content-automator/pilotRamFit/render.ts --liam-take render-output/ram-fit-liam-take

      - name: Summarise the render as notices
        working-directory: artifacts/SpecSmith
        run: pnpm exec tsx scripts/content-automator/pilotRamFit/ciSummary.ts render-output/pilot-ram-fit-final/report.json

      - name: Upload the final MP4 for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: specsmith-ram-fit-final
          path: artifacts/SpecSmith/render-output/pilot-ram-fit-final/
          if-no-files-found: error
          retention-days: 14

  # Renders the RAM-fit pilot from the one paid take that already exists, so a
  # timing change never needs another generation. No secret, no provider call,
  # no write permission: the job's own token can only read this repository and
  # its Actions metadata. It verifies the pinned run and artifact (savedTake.ts)
  # before downloading, and the renderer refuses any audio but the pinned bytes.
  render-ram-fit-saved-take:
    if: inputs.script == 'ram-fit-saved-take'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify the saved take's run and artifact
        working-directory: artifacts/SpecSmith
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm exec tsx scripts/content-automator/pilotRamFit/savedTake.ts

      - name: Download the saved take
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: specsmith-ram-fit-liam-take
          run-id: 37086531999
          github-token: ${{ github.token }}
          path: artifacts/SpecSmith/render-output/ram-fit-liam-take

      - name: Install ffmpeg and Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -hide_banner -encoders | grep -q ' libx264 ' || { echo "::error::ffmpeg has no libx264 encoder."; exit 1; }
          cd artifacts/SpecSmith && pnpm exec playwright install --with-deps chromium

      - name: Build and serve the app for the Builder warning capture
        working-directory: artifacts/SpecSmith
        run: |
          pnpm exec vite build --config vite.config.ts
          nohup pnpm exec vite preview --config vite.config.ts --port 5178 --strictPort > "$RUNNER_TEMP/preview.log" 2>&1 &
          for attempt in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:5178/builder && exit 0
            sleep 1
          done
          echo "::error::The built app did not start; the Builder warning cannot be captured."
          cat "$RUNNER_TEMP/preview.log"
          exit 1

      - name: Time the locked cut to the saved take and render the final MP4
        working-directory: artifacts/SpecSmith
        env:
          SPECSMITH_RENDER_BASE_URL: http://localhost:5178
        run: pnpm exec tsx scripts/content-automator/pilotRamFit/render.ts --saved-take render-output/ram-fit-liam-take

      - name: Summarise the render as notices
        working-directory: artifacts/SpecSmith
        run: pnpm exec tsx scripts/content-automator/pilotRamFit/ciSummary.ts render-output/pilot-ram-fit-final/report.json

      - name: Upload the final MP4 for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: specsmith-ram-fit-final
          path: artifacts/SpecSmith/render-output/pilot-ram-fit-final/
          if-no-files-found: error
          retention-days: 14

  # Posts the FPS take to its review PR so it can be timed and rendered where
  # artifact downloads are not reachable. No provider secret, no checkout, no
  # repository write: its token can only comment on pull requests. The take is
  # split into base64 parts, each labelled with the take's SHA-256.
  share-fps-take:
    needs: sample
    if: inputs.script == 'fps-20-wins'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Download the take
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: specsmith-fps-20-wins-liam-take
          path: take

      - name: Post the take to the review PR
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_PR: ${{ inputs.review_pr }}
        run: |
          case "$REVIEW_PR" in ''|*[!0-9]*) echo "::error::review_pr must be a PR number."; exit 1;; esac
          # Before any write: the number must be a pull request, and the one for this branch.
          head=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${REVIEW_PR}" --jq .head.ref) || { echo "::error::#${REVIEW_PR} is not a pull request; nothing posted."; exit 1; }
          [ "$head" = "$GITHUB_REF_NAME" ] || { echo "::error::#${REVIEW_PR} is the PR for ${head}, not ${GITHUB_REF_NAME}; nothing posted."; exit 1; }
          tar -czf take.tgz -C take .
          sum=$(sha256sum take.tgz | cut -d' ' -f1)
          { base64 -w0 take.tgz | fold -w 60000; echo; } > parts.txt
          total=$(wc -l < parts.txt)
          i=0
          while IFS= read -r chunk; do
            i=$((i+1))
            printf 'fps-take %s/%s sha256 %s\n<!-- take-part -->\n```\n%s\n```\n' "$i" "$total" "$sum" "$chunk" > body.md
            gh api "repos/${GITHUB_REPOSITORY}/issues/${REVIEW_PR}/comments" -F body=@body.md --silent
          done < parts.txt
          echo "Posted ${total} part(s) of take.tgz (sha256 ${sum}) to #${REVIEW_PR}."
