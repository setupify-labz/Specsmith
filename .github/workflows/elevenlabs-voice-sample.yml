# Opt-in Liam narration — MANUAL TRIGGER ONLY.
#
# This is the only workflow in this repository that spends a paid provider's
# credits, so it is deliberately hard to run by accident:
#
#   - `workflow_dispatch` only. No push, pull_request, or schedule trigger.
#   - The operator must type the word `generate` to confirm.
#   - It generates ONE approved narration and stops:
#     `power-switch` is ONE Liam take of the "PC won't turn on?" Short's
#     66-character script, approved word for word (nextVideoPowerSwitch/
#     liamTake.ts), behind the same spending guards.
#     `gpu-upgrade` is ONE Liam take of the GPU-upgrade Short's six approved
#     lines (nextVideoGpuUpgrade/liamTake.ts). Before any spend it recomputes
#     every figure the lines speak from the Compare model, checks each line is
#     its beat's approved narration, and applies the shared spending guards
#     (voiceSpendGuards.ts): the character cap, an explicit no-overage
#     subscription, enough included characters, and the pinned Liam id.
#   - A second job, with no provider secret and no checkout, posts the take to
#     the review PR named in `review_pr` so it can be timed and rendered. Its
#     token can only comment on pull requests, and only on this branch's PR.
#
# The job holding the key never renders a video, never publishes, and never
# falls back to a fixture voice: if generation fails, the job fails with the
# reason. The take is rendered elsewhere, from the saved file, so a failed
# render never needs a second generation.
#
# Every action is pinned to a commit SHA rather than a moving tag, as in every
# other workflow here. A tag can be repointed by whoever controls the action's
# repository, and this job holds a paid API key while it runs.
name: ElevenLabs voice sample (manual)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "generate" to confirm spending included ElevenLabs credits'
        required: true
        default: ''
      script:
        description: 'Which approved narration to generate'
        required: true
        type: choice
        default: gpu-upgrade
        options:
          - gpu-upgrade
          - power-switch
      review_pr:
        description: 'The draft PR number the take is posted to for review (this branch''s PR)'
        required: true
        default: ''

permissions:
  contents: read

concurrency:
  # One narration at a time. Overlapping runs would spend credits twice for the
  # same decision.
  group: elevenlabs-voice-sample
  cancel-in-progress: false

jobs:
  sample:
    runs-on: ubuntu-latest
    # A stuck run on the one workflow that spends a provider's credits should
    # end by itself. Install plus one short narration is minutes, not tens.
    timeout-minutes: 10
    steps:
      - name: Require explicit confirmation
        if: inputs.confirm != 'generate'
        run: |
          echo "::error::Refusing to run. Re-dispatch with confirm set to exactly: generate"
          exit 1

      - name: Require a review PR number before any spend
        env:
          REVIEW_PR: ${{ inputs.review_pr }}
        run: |
          case "$REVIEW_PR" in ''|*[!0-9]*) echo "::error::review_pr must be a PR number; nothing generated."; exit 1;; esac

      - name: Require the API key to be configured as a secret
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          # Presence check only. The value is never echoed, and GitHub masks it
          # in logs regardless.
          if [ -z "${ELEVENLABS_API_KEY}" ]; then
            echo "::error::ELEVENLABS_API_KEY is not configured for this repository."
            exit 1
          fi
          echo "ELEVENLABS_API_KEY is configured (value not printed)."

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # This job reads a paid provider's key. It has no reason to also
          # carry a token that can push to the repository.
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate one Liam take of the GPU-upgrade Short
        if: inputs.script == 'gpu-upgrade'
        working-directory: artifacts/SpecSmith
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: TX3LPaxmHKxFdv7VOQHJ
          ELEVENLABS_MODEL_ID: ${{ vars.ELEVENLABS_MODEL_ID }}
          ELEVENLABS_OUTPUT_FORMAT: ${{ vars.ELEVENLABS_OUTPUT_FORMAT }}
        run: pnpm exec tsx scripts/content-automator/nextVideoGpuUpgrade/liamTake.ts

      - name: Upload the GPU-upgrade take
        # Uploaded even if the timestamps were unusable: the paid audio is kept.
        if: ${{ always() && inputs.script == 'gpu-upgrade' && hashFiles('artifacts/SpecSmith/render-output/gpu-upgrade-liam-take/*') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: specsmith-gpu-upgrade-liam-take
          path: artifacts/SpecSmith/render-output/gpu-upgrade-liam-take/
          if-no-files-found: error
          retention-days: 30

      - name: Generate one Liam take of the power-switch Short
        if: inputs.script == 'power-switch'
        working-directory: artifacts/SpecSmith
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: TX3LPaxmHKxFdv7VOQHJ
          ELEVENLABS_MODEL_ID: ${{ vars.ELEVENLABS_MODEL_ID }}
          ELEVENLABS_OUTPUT_FORMAT: ${{ vars.ELEVENLABS_OUTPUT_FORMAT }}
        run: pnpm exec tsx scripts/content-automator/nextVideoPowerSwitch/liamTake.ts

      - name: Upload the power-switch take
        # Uploaded even if the timestamps were unusable: the paid audio is kept.
        if: ${{ always() && inputs.script == 'power-switch' && hashFiles('artifacts/SpecSmith/render-output/power-switch-liam-take/*') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: specsmith-power-switch-liam-take
          path: artifacts/SpecSmith/render-output/power-switch-liam-take/
          if-no-files-found: error
          retention-days: 30

  # Posts the take to its review PR so it can be timed and rendered where
  # artifact downloads are not reachable. No provider secret, no checkout, no
  # repository write: its token can only comment on pull requests. The take is
  # split into base64 parts, each labelled with the archive's SHA-256.
  share-gpu-upgrade-take:
    needs: sample
    if: ${{ always() && inputs.script == 'gpu-upgrade' && needs.sample.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Download the take
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: specsmith-gpu-upgrade-liam-take
          path: take

      - name: Post the take to the review PR
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_PR: ${{ inputs.review_pr }}
        run: |
          case "$REVIEW_PR" in ''|*[!0-9]*) echo "::error::review_pr must be a PR number."; exit 1;; esac
          # Before any write: the number must be a pull request, and the one for this branch.
          head=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${REVIEW_PR}" --jq .head.ref) || { echo "::error::#${REVIEW_PR} is not a pull request; nothing posted."; exit 1; }
          [ "$head" = "$GITHUB_REF_NAME" ] || { echo "::error::#${REVIEW_PR} is the PR for ${head}, not ${GITHUB_REF_NAME}; nothing posted."; exit 1; }
          tar -czf take.tgz -C take .
          sum=$(sha256sum take.tgz | cut -d' ' -f1)
          { base64 -w0 take.tgz | fold -w 60000; echo; } > parts.txt
          total=$(wc -l < parts.txt)
          i=0
          while IFS= read -r chunk; do
            i=$((i+1))
            printf 'gpu-upgrade-take %s/%s sha256 %s\n<!-- take-part -->\n```\n%s\n```\n' "$i" "$total" "$sum" "$chunk" > body.md
            gh api "repos/${GITHUB_REPOSITORY}/issues/${REVIEW_PR}/comments" -F body=@body.md --silent
          done < parts.txt
          echo "Posted ${total} part(s) of take.tgz (sha256 ${sum}) to #${REVIEW_PR}."

  # The same hand-over for the power-switch take: no provider secret, no
  # checkout, PR comments only, on this branch's own PR.
  share-power-switch-take:
    needs: sample
    if: ${{ always() && inputs.script == 'power-switch' && needs.sample.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Download the take
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: specsmith-power-switch-liam-take
          path: take

      - name: Post the take to the review PR
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_PR: ${{ inputs.review_pr }}
        run: |
          case "$REVIEW_PR" in ''|*[!0-9]*) echo "::error::review_pr must be a PR number."; exit 1;; esac
          # Before any write: the number must be a pull request, and the one for this branch.
          head=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${REVIEW_PR}" --jq .head.ref) || { echo "::error::#${REVIEW_PR} is not a pull request; nothing posted."; exit 1; }
          [ "$head" = "$GITHUB_REF_NAME" ] || { echo "::error::#${REVIEW_PR} is the PR for ${head}, not ${GITHUB_REF_NAME}; nothing posted."; exit 1; }
          tar -czf take.tgz -C take .
          sum=$(sha256sum take.tgz | cut -d' ' -f1)
          { base64 -w0 take.tgz | fold -w 60000; echo; } > parts.txt
          total=$(wc -l < parts.txt)
          i=0
          while IFS= read -r chunk; do
            i=$((i+1))
            printf 'power-switch-take %s/%s sha256 %s\n<!-- take-part -->\n```\n%s\n```\n' "$i" "$total" "$sum" "$chunk" > body.md
            gh api "repos/${GITHUB_REPOSITORY}/issues/${REVIEW_PR}/comments" -F body=@body.md --silent
          done < parts.txt
          echo "Posted ${total} part(s) of take.tgz (sha256 ${sum}) to #${REVIEW_PR}."
