# Manual, credential-free CI evidence gate for the content-automator's real
# offline end-to-end path (scripts/content-automator/endToEndOfflinePipeline.ts,
# issue #82 / PR #83 / issue #89's actual-generated-plan wiring).
#
# NOTHING HERE TOUCHES A CREDENTIAL
# ----------------------------------
# No `secrets.` reference anywhere in this file. The pipeline it runs uses
# only local, offline fixtures — a local espeak-ng TTS binary instead of paid
# ElevenLabs, a real Playwright/Chromium capture of this repo's own built app
# instead of any third-party API, real ffmpeg composition — and needs no API
# key. That is not a promise in a comment: it is asserted structurally by
# contentE2eOfflineWorkflowSafety.test.ts, the same role
# auditRetailerLinksWorkflowSafety.test.ts already plays for
# audit-retailer-links.yml.
#
# WHY push-on-one-branch, NOT a generic pull_request trigger
# -------------------------------------------------------------
# GitHub only lets workflow_dispatch be triggered via the API for a workflow
# file already present on the repository's DEFAULT branch — this file cannot
# be, until this PR merges. audit-retailer-links.yml solves the same
# "evidence for one specific implementation branch, before merge" problem the
# same way: `push` scoped to the one branch by name, not a generic
# `pull_request` trigger that would start running on every fork PR. That
# pattern is reused here rather than introduced fresh. `workflow_dispatch`
# stays too, for a rerun once this lands on main and the branch trigger no
# longer applies.
#
# WHY THE PIPELINE STEP CAN EXIT NONZERO WITHOUT FAILING THE JOB
# -------------------------------------------------------------------
# endToEndOfflinePipeline.ts's quality-review gate (section 3) only trusts a
# render's scores if this run's actual rendered sha256 matches the sha256
# recorded, once, in the committed
# scripts/content-automator/fixtures/generated-plan-offline-observation.json —
# fail-closed by design (see that file and qualityReviewer.ts's
# matchRenderToRecordedEvidence). Every UI beat here is a static capture (no
# interactive sequence step), but ffmpeg's own encode/mux is still not
# guaranteed byte-identical across runs of identical inputs (container
# timestamps, encoder scheduling) — confirmed empirically (two separate local
# renders of the same commit produced two distinct sha256 hashes with
# visually/audibly identical content). A CI runner is yet another machine, so this step's
# most likely outcome is the pipeline correctly stopping at that evidence gate
# rather than reaching "Done" — that is the fix working as designed, not a
# regression, and it is NOT the same as the pipeline crashing for some other
# reason.
#
# Independently, even when the sha256 does match, the quality gate also
# fails closed on audio (qualityReviewer.ts's audio-not-genuinely-reviewed
# check): a passing verdict requires the recorded observation's
# audioReviewMethod to be "listened-full", and the committed evidence file
# honestly records "signal-analysis-only" (ffmpeg silence/volume stats, not
# a real listen — no CI runner or agent environment this script has ever run
# in can actually listen). So this run's other most likely outcome is
# stopping at the same throw with decision=hold-for-human-review, logged as
# `error:audio-not-genuinely-reviewed` in the Issues line — also the fix
# working as designed, not a regression.
#
# This step therefore captures the exit code and the full log: an exit code
# of 0, or a nonzero exit whose log shows one of these two specific, expected
# stops ("Evidence check: NO MATCH" or `audio-not-genuinely-reviewed`), both
# pass the step; any other nonzero exit fails it.
#
# WHAT THE UPLOADED ARTIFACT CONTAINS
# -------------------------------------
# The commit under test, install/typecheck/test/build logs, the pipeline's
# own console log and exit code, the rendered MP4, and two extracted frame
# PNGs (for a human to glance at without downloading the video) — no
# benchmark, price, or analytics data beyond what scripts/content-automator's
# own tests already cover, and the render is this repository's own UI, not
# third-party content — so it gets the same short one-day retention as the
# other manual evidence-gate artifacts.

name: Content automator offline end-to-end

on:
  push:
    branches:
      - claude/intelligent-bohr-naord4
      - claude/intelligent-bohr-srl3f9
    paths:
      - '.github/workflows/content-e2e-offline.yml'
      - 'artifacts/SpecSmith/scripts/content-automator/**'
      - 'artifacts/SpecSmith/src/**'
      - 'artifacts/SpecSmith/public/data/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: content-e2e-offline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  e2e:
    name: Typecheck, test, build and run the offline content pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the exact selected commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Report the commit under test
        run: |
          set -euo pipefail
          echo "Running commit ${GITHUB_SHA}"
          mkdir -p "${RUNNER_TEMP}/e2e"
          {
            echo "commit: ${GITHUB_SHA}"
            git log -1 --pretty='format:%s%n'
          } > "${RUNNER_TEMP}/e2e/commit.txt"
          echo "commit: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm

      # Every piped `cmd | tee log` step below sets `set -o pipefail` FIRST.
      # Without it, the step's exit code is `tee`'s (always 0), not the
      # piped command's — independent review of this exact workflow found
      # precisely that: run 33680791532's uploaded test-full.log recorded
      # "1 failed / 1,929 passed" while GitHub reported the step and job
      # green. Confirmed by direct local reproduction: `false | tee log`
      # exits 0 without pipefail, 1 with it — every step below now sets it
      # explicitly rather than relying on the runner's default shell flags.
      - name: Install dependencies
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile 2>&1 | tee "${RUNNER_TEMP}/e2e/install.log"

      - name: Typecheck
        run: |
          set -o pipefail
          pnpm typecheck 2>&1 | tee "${RUNNER_TEMP}/e2e/typecheck.log"

      - name: Run the content-automator test suite (targeted)
        working-directory: artifacts/SpecSmith
        run: |
          set -o pipefail
          pnpm exec vitest run scripts/content-automator 2>&1 | tee "${RUNNER_TEMP}/e2e/test-targeted.log"

      - name: Run the full test suite
        working-directory: artifacts/SpecSmith
        run: |
          set -o pipefail
          pnpm exec vitest run 2>&1 | tee "${RUNNER_TEMP}/e2e/test-full.log"

      - name: Build the production application
        working-directory: artifacts/SpecSmith
        run: |
          set -o pipefail
          pnpm run build 2>&1 | tee "${RUNNER_TEMP}/e2e/build.log"

      # No API key, no account, no paid provider — just a browser binary, the
      # same way any other Playwright-based test in this repo would get one.
      - name: Install Playwright Chromium
        working-directory: artifacts/SpecSmith
        run: |
          set -o pipefail
          pnpm exec playwright install --with-deps chromium 2>&1 | tee "${RUNNER_TEMP}/e2e/playwright-install.log"

      # ffmpeg/ffprobe compose the real MP4; espeak-ng is the offline TTS
      # fixture (see localFixtureTts.ts) — neither needs a credential.
      - name: Install ffmpeg and espeak-ng
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg espeak-ng

      - name: Serve the built application
        working-directory: artifacts/SpecSmith
        run: |
          set -euo pipefail
          npx --yes serve dist/public -l 5178 --no-clipboard > "${RUNNER_TEMP}/e2e/serve.log" 2>&1 &
          for _ in $(seq 1 30); do
            if curl -sS -o /dev/null "http://localhost:5178/compare"; then
              echo "Local server is up."
              exit 0
            fi
            sleep 1
          done
          echo "Local server never came up." >&2
          cat "${RUNNER_TEMP}/e2e/serve.log" >&2
          exit 1

      # See this file's own header for why a nonzero exit here is not
      # automatically a workflow failure.
      - name: Run the offline end-to-end content pipeline
        working-directory: artifacts/SpecSmith
        env:
          SPECSMITH_RENDER_BASE_URL: http://localhost:5178
        run: |
          set +e
          pnpm exec tsx scripts/content-automator/endToEndOfflinePipeline.ts \
            > "${RUNNER_TEMP}/e2e/pipeline.log" 2>&1
          code=$?
          set -e
          echo "exit code: ${code}" | tee "${RUNNER_TEMP}/e2e/pipeline-exit-code.txt"
          cat "${RUNNER_TEMP}/e2e/pipeline.log"
          if [ "${code}" -eq 0 ]; then
            echo "Pipeline reached Done — this run's render matched the committed evidence file's sha256."
            exit 0
          fi
          if grep -q "Evidence check: NO MATCH" "${RUNNER_TEMP}/e2e/pipeline.log"; then
            echo "Pipeline stopped at the evidence-binding gate (awaiting-review): EXPECTED on this runner — see this workflow file's header for why the render is not byte-reproducible across machines. This is the fail-closed gate working, not a regression."
            exit 0
          fi
          if grep -q "audio-not-genuinely-reviewed" "${RUNNER_TEMP}/e2e/pipeline.log"; then
            echo "Pipeline stopped at the audio-review gate (hold-for-human-review): EXPECTED — see this workflow file's header. The committed evidence honestly records audioReviewMethod: signal-analysis-only, and no environment this script runs in can genuinely listen, so the gate correctly refuses to certify audio clarity from signal statistics alone. This is the fail-closed gate working, not a regression."
            exit 0
          fi
          echo "Pipeline failed for a reason OTHER than the expected evidence mismatch or audio-review gate — treating this as a real failure."
          exit "${code}"

      - name: Extract two frames from the rendered MP4, if one was produced
        if: always()
        run: |
          set -euo pipefail
          # offlineGeneratedPlanRender.ts always writes into this fixed
          # directory, but its filename embeds the content package's
          # timestamp-based id (see contentPackage.ts's campaignId), so it
          # cannot be hardcoded the way offlineCompositorSmoke.ts's fixed
          # OFFLINE_SMOKE_PACKAGE_ID output name could be.
          mp4="$(find artifacts/SpecSmith/render-output/generated-plan-offline -maxdepth 1 -name '*.mp4' -print -quit || true)"
          if [ -n "${mp4}" ] && [ -f "${mp4}" ]; then
            ffmpeg -y -ss 0.3 -i "${mp4}" -frames:v 1 -update 1 -q:v 2 "${RUNNER_TEMP}/e2e/frame-opening.png"
            ffmpeg -y -ss 6.9 -i "${mp4}" -frames:v 1 -update 1 -q:v 2 "${RUNNER_TEMP}/e2e/frame-later.png"
            cp "${mp4}" "${RUNNER_TEMP}/e2e/rendered-master.mp4"
          else
            echo "No rendered MP4 was produced; nothing to extract."
          fi

      - name: Upload the evidence for review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: content-e2e-offline-${{ github.run_id }}
          path: ${{ runner.temp }}/e2e
          if-no-files-found: error
          retention-days: 1

      - name: Confirm the repository was not modified
        if: always()
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain -- . ':!artifacts/SpecSmith/render-output' ':!artifacts/SpecSmith/content-ideas' ':!artifacts/SpecSmith/dist')" ]; then
            echo "The working tree was modified by this workflow outside its own generated output:"
            git status --porcelain -- . ':!artifacts/SpecSmith/render-output' ':!artifacts/SpecSmith/content-ideas' ':!artifacts/SpecSmith/dist'
            exit 1
          fi
          echo "Working tree clean (aside from this run's own gitignored render/build/store output)."
