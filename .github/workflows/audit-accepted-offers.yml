# Manual evidence gate before the first GPU price snapshot is published.
# Merchant titles go only into a one-day artifact. Logs receive counts and
# closed categories; prices, URLs, identifiers, raw XML and credentials never
# enter the artifact or the log.

name: Audit accepted GPU offers

on:
  # One-time bootstrap for the first evidence run: this path can start only
  # when this workflow file itself changes on the implementation branch. The
  # trigger is removed immediately after the artifact is collected.
  push:
    branches:
      - claude/rakuten-newegg-adapter-97h85y
    paths:
      - '.github/workflows/audit-accepted-offers.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: accepted-gpu-offer-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    name: Review artifact from full GPU sweep
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the exact selected commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Report the commit under test
        run: |
          set -euo pipefail
          echo "Auditing commit ${GITHUB_SHA}"

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Run audit, adapter and snapshot tests
        working-directory: artifacts/SpecSmith
        run: pnpm exec vitest run scripts/retail/audit scripts/retail/rakuten scripts/retail/snapshot src/lib/retail

      # The only step holding the long-lived credentials. The short-lived
      # token is masked by the existing minter, kept outside the checkout and
      # removed before this step ends. The audit JSON also lives outside the
      # checkout and is uploaded by a later credential-free step.
      - name: Mint an access token and build the review artifact
        working-directory: artifacts/SpecSmith
        env:
          RAKUTEN_CLIENT_ID: ${{ secrets.RAKUTEN_CLIENT_ID }}
          RAKUTEN_CLIENT_SECRET: ${{ secrets.RAKUTEN_CLIENT_SECRET }}
          RAKUTEN_PUBLISHER_SID: ${{ secrets.RAKUTEN_PUBLISHER_SID }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "${RUNNER_TEMP}/audit"
          token_file="$(mktemp "${RUNNER_TEMP}/rakuten-access-token.XXXXXXXX")"
          trap 'rm -f "${token_file}"' EXIT
          pnpm exec tsx scripts/retail/rakuten/request-access-token.ts --out "${token_file}"
          RAKUTEN_API_ACCESS_TOKEN="$(cat "${token_file}")"
          rm -f "${token_file}"
          export RAKUTEN_API_ACCESS_TOKEN
          pnpm exec tsx scripts/retail/audit/audit-accepted-offers.ts \
            --out "${RUNNER_TEMP}/audit/accepted-offers.json"

      - name: Upload the audit for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: accepted-gpu-offer-audit-${{ github.run_id }}
          path: ${{ runner.temp }}/audit/accepted-offers.json
          if-no-files-found: error
          retention-days: 1

      - name: Confirm the repository was not modified
        if: always()
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain)" ]; then
            echo "The working tree was modified by this workflow."
            exit 1
          fi
          echo "Working tree clean."
