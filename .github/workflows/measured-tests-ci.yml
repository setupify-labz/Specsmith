# Manual, credential-free CI evidence gate for the measured-process test
# determinism fix (scripts/measured/cancellation.test.ts and
# scripts/measured/presentmonRunner.test.ts, issue #93 / PR #94).
#
# NOTHING HERE TOUCHES A CREDENTIAL
# ----------------------------------
# No `secrets.` reference anywhere in this file. Every step here is
# typecheck, vitest, and a production build against files already committed
# to the repository — no network call beyond installing dependencies, and no
# API key.
#
# WHY push-on-one-branch, NOT a generic pull_request trigger
# -------------------------------------------------------------
# GitHub only lets workflow_dispatch be triggered via the API for a workflow
# file already present on the repository's DEFAULT branch — this file cannot
# be, until this PR merges. audit-retailer-links.yml and
# content-e2e-offline.yml solve the same "evidence for one specific
# implementation branch, before merge" problem the same way: `push` scoped to
# the one branch by name, not a generic `pull_request` trigger that would
# start running on every fork PR. That pattern is reused here rather than
# introduced fresh. `workflow_dispatch` stays too, for a rerun once this
# lands on main and the branch trigger no longer applies.
#
# WHY THE MEASURED SUITE RUNS REPEATEDLY, NOT JUST ONCE
# -------------------------------------------------------------
# The whole point of this PR is that these two files were flaky under
# repeated runs, not reliably broken every time — a single green run proves
# little. This workflow runs the two previously-flaky files 20 times back to
# back, then the full `scripts/measured` suite once more for good measure,
# before moving on to the full repository suite and the production build.
#
# WHAT THE UPLOADED ARTIFACT CONTAINS
# -------------------------------------
# The commit under test, install/typecheck logs, one log per stress
# iteration of the previously-flaky files, the full-measured-suite log, the
# full-repository-suite log, and the build log. No benchmark, price, or
# analytics data.

name: Measured-process tests CI evidence

on:
  push:
    branches:
      - claude/intelligent-bohr-a832hs
    paths:
      - '.github/workflows/measured-tests-ci.yml'
      - 'artifacts/SpecSmith/scripts/measured/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: measured-tests-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  evidence:
    name: Typecheck, stress-test, full-suite and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the exact selected commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Report the commit under test
        run: |
          set -euo pipefail
          echo "Testing commit ${GITHUB_SHA}"
          mkdir -p "${RUNNER_TEMP}/evidence"
          {
            echo "commit: ${GITHUB_SHA}"
            git log -1 --pretty='format:%s%n'
          } > "${RUNNER_TEMP}/evidence/commit.txt"
          echo "commit: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile 2>&1 | tee "${RUNNER_TEMP}/evidence/install.log"

      - name: Typecheck
        run: pnpm typecheck 2>&1 | tee "${RUNNER_TEMP}/evidence/typecheck.log"

      # The two files reported flaky in issue #93, run back to back 20 times
      # under whatever concurrency this runner already has. Any single
      # failing iteration fails this step — a flake surviving even once here
      # means the fix did not hold.
      - name: Stress-run the previously flaky files (20 iterations)
        working-directory: artifacts/SpecSmith
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/evidence/stress"
          for i in $(seq 1 20); do
            echo "=== iteration ${i} ==="
            pnpm exec vitest run scripts/measured/cancellation.test.ts scripts/measured/presentmonRunner.test.ts \
              2>&1 | tee "${RUNNER_TEMP}/evidence/stress/iteration-${i}.log"
          done

      - name: Run the full measured suite
        working-directory: artifacts/SpecSmith
        run: pnpm exec vitest run scripts/measured 2>&1 | tee "${RUNNER_TEMP}/evidence/test-measured-full.log"

      - name: Run the full repository test suite
        working-directory: artifacts/SpecSmith
        run: pnpm run test 2>&1 | tee "${RUNNER_TEMP}/evidence/test-full.log"

      - name: Build the production application
        working-directory: artifacts/SpecSmith
        run: pnpm run build 2>&1 | tee "${RUNNER_TEMP}/evidence/build.log"

      - name: Upload the evidence for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: measured-tests-ci-${{ github.run_id }}
          path: ${{ runner.temp }}/evidence
          if-no-files-found: error
          retention-days: 7

      - name: Confirm the repository was not modified
        if: always()
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain)" ]; then
            echo "The working tree was modified by this workflow:"
            git status --porcelain
            exit 1
          fi
          echo "Working tree clean."
