name: Verify dependency cleanup

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify:
    if: github.head_ref == 'cleanup/remove-replit-dependencies'
    runs-on: ubuntu-latest
    steps:
      - name: Check out cleanup branch
        uses: actions/checkout@v4
        with:
          ref: cleanup/remove-replit-dependencies

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate

      - name: Install with frozen lockfile
        run: pnpm install --frozen-lockfile

      - name: Typecheck SpecSmith
        run: pnpm --filter @workspace/specsmith run typecheck

      - name: Test SpecSmith
        run: pnpm --filter @workspace/specsmith run test

      - name: Build SpecSmith
        run: pnpm --filter @workspace/specsmith run build

      - name: Typecheck mockup sandbox
        run: pnpm --filter @workspace/mockup-sandbox run typecheck

      - name: Build mockup sandbox
        run: pnpm --filter @workspace/mockup-sandbox run build

      - name: Remove one-shot workflow and verify no legacy references
        run: |
          rm .github/workflows/verify-cleanup.yml
          if git grep -ni 'replit' -- ':!*.png' ':!*.jpg' ':!*.jpeg' ':!*.webp'; then
            echo 'Legacy platform references remain after cleanup.' >&2
            exit 1
          fi

      - name: Commit workflow removal
        if: always()
        run: |
          if [ -f .github/workflows/verify-cleanup.yml ]; then
            rm .github/workflows/verify-cleanup.yml
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/verify-cleanup.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Remove one-shot cleanup verification workflow'
          git push origin HEAD:cleanup/remove-replit-dependencies
