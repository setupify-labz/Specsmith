# Live validation of the Rakuten x Newegg GPU coverage sweep.
#
# This is a VALIDATION workflow, not the scheduled price-refresh workflow. It
# runs the full catalogue sweep once against the live Product Search API and
# asserts the correction in c378f33 holds against real responses. It writes
# nothing back to the repository and publishes no offer data.
#
# WHY THE CREDENTIALS ARE SAFE HERE
# ---------------------------------
# The job mints its own short-lived access token from long-lived client
# credentials, so nothing has to be pasted by hand and nothing expires between
# runs. All three credentials reach exactly ONE step as step-scoped environment
# variables — there is no separate preflight, because a second step holding them
# would double the surface to prove nothing the minter does not already prove:
# it fails with a `missing-credentials` category naming the absent VARIABLES.
# The token they produce never leaves that one step either: it is masked with
# ::add-mask:: before anything can emit it, written to a file outside the
# checkout with owner-only permissions, read into a shell variable, and the file
# is removed. The step that renders and publishes the report runs WITHOUT any of
# it, so a leak from the reporting path is not unlikely — it is unreachable.
#
# GitHub masks exact secret values in logs. That masking is a backstop, not the
# boundary: the boundary is that the credential is never placed in an argument,
# a query string, a file, an artifact or a summary in the first place. The
# minter also refuses to emit a mask for a token carrying a control character,
# so a hostile token response cannot forge a second workflow command.
#
# Every action is pinned to the full commit SHA that ran successfully, with the
# tag it resolved from in a trailing comment. A tag is a moving pointer the
# upstream owner can repoint at any commit; these credentials must not be
# exposed to code that changed between one run and the next.

name: Validate Rakuten GPU coverage

on:
  # Push only, and only on the implementation branch. Deliberately NOT
  # pull_request: a fork PR must never be able to run a job holding this
  # credential, and a same-repo PR would only duplicate the push run.
  push:
    branches:
      - claude/rakuten-newegg-adapter-97h85y
    paths:
      - '.github/workflows/validate-rakuten-gpu-coverage.yml'
      - 'artifacts/SpecSmith/scripts/retail/**'
  workflow_dispatch:

# Read-only. This job clones, installs, tests and calls an external API. It has
# no reason to write to the repository and no token that would let it.
permissions:
  contents: read

# One validation at a time. A superseded push should not race a newer one
# against a rate-limited account.
concurrency:
  group: rakuten-gpu-coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Full 57-GPU live sweep
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the exact triggering commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Report the commit under test
        run: |
          set -euo pipefail
          echo "Validating commit ${GITHUB_SHA}"
          echo "commit: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          git log -1 --pretty='format:%s' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

      # pnpm before Node: setup-node's pnpm cache needs the package manager to
      # already be on PATH. The action is SHA-pinned, but the pnpm VERSION it
      # installs deliberately is not — with no `version:` key, action-setup reads
      # `packageManager` from the root package.json, so CI and local installs
      # can never drift apart.
      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Everything that can be proven without the credential is proven first.
      # A broken matcher should fail here, before a single API call is spent.
      - name: Typecheck
        run: pnpm typecheck

      - name: Run the retail adapter and coverage tests
        working-directory: artifacts/SpecSmith
        run: pnpm exec vitest run scripts/retail

      # THE ONLY STEP THAT SEES ANY CREDENTIAL — there is no preflight, on
      # purpose. A missing or blank credential is caught by the minter itself,
      # which fails with the closed `missing-credentials` category naming the
      # variables that were empty; a second step existing only to repeat that
      # check would hand the three long-lived secrets to twice as much shell.
      #
      # Minting and sweeping are one step on purpose: the access token lives in
      # a shell variable inside this step and in no other scope. $GITHUB_ENV
      # would have exported it to every later step, including the one that
      # writes a job summary.
      #
      # The token file is created with umask 077 under RUNNER_TEMP — outside the
      # checkout, so it cannot be committed — is removed as soon as it has been
      # read, and again by the trap if anything exits early.
      #
      # The CLI's exit code is captured rather than allowed to end the job, so
      # the reporting step below still runs and explains WHY a sweep failed.
      # The captured code is then asserted as a gate, so a failure cannot be
      # swallowed.
      - name: Mint an access token and run the full GPU coverage sweep
        id: sweep
        working-directory: artifacts/SpecSmith
        env:
          RAKUTEN_CLIENT_ID: ${{ secrets.RAKUTEN_CLIENT_ID }}
          RAKUTEN_CLIENT_SECRET: ${{ secrets.RAKUTEN_CLIENT_SECRET }}
          RAKUTEN_PUBLISHER_SID: ${{ secrets.RAKUTEN_PUBLISHER_SID }}
        run: |
          set -euo pipefail
          umask 077
          token_file="$(mktemp "${RUNNER_TEMP}/rakuten-access-token.XXXXXXXX")"
          trap 'rm -f "${token_file}"' EXIT
          pnpm exec tsx scripts/retail/rakuten/request-access-token.ts --out "${token_file}"
          RAKUTEN_API_ACCESS_TOKEN="$(cat "${token_file}")"
          rm -f "${token_file}"
          export RAKUTEN_API_ACCESS_TOKEN
          status=0
          pnpm exec tsx scripts/retail/coverage/measure-coverage.ts --json \
            > "${RUNNER_TEMP}/coverage.json" || status=$?
          echo "exit_code=${status}" >> "$GITHUB_OUTPUT"
          echo "coverage sweep exited ${status}"

      # Runs WITHOUT any credential. Renders the report, asserts every gate, and
      # refuses to publish a summary containing a URL or identifier.
      - name: Validate gates and publish the report
        if: always()
        working-directory: artifacts/SpecSmith
        run: |
          set -euo pipefail
          pnpm exec tsx scripts/retail/coverage/assert-coverage-gates.ts \
            --report "${RUNNER_TEMP}/coverage.json" \
            --sweep-exit "${{ steps.sweep.outputs.exit_code || '1' }}"

      # Belt and braces: the report lives in RUNNER_TEMP, outside the checkout,
      # so it cannot be committed even by accident. This proves the working
      # tree is unchanged.
      - name: Confirm the repository was not modified
        if: always()
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain)" ]; then
            echo "The working tree was modified by this workflow:"
            git status --porcelain
            exit 1
          fi
          echo "Working tree clean."
