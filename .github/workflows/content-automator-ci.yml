name: Content Automator CI

on:
  push:
    branches:
      - chatgpt/content-automator-v1
      - chatgpt/content-compositor-v1
      - chatgpt/elevenlabs-video-v1
      - claude/content-ui-renderer-v1
  pull_request:
    branches:
      - main
      - chatgpt/content-automator-v1
  workflow_dispatch:

jobs:
  test-content-automator:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run content automator tests
        run: >-
          pnpm --dir artifacts/SpecSmith exec vitest run
          scripts/content-automator/strategist.test.ts
          scripts/content-automator/logicalAutomator.test.ts
          scripts/content-automator/contentPackage.test.ts
          scripts/content-automator/scriptStoryboard.test.ts
          scripts/content-automator/productionPlan.test.ts
          scripts/content-automator/audioTrend.test.ts
          scripts/content-automator/trendSource.test.ts
          scripts/content-automator/bundleTikTokTrendSource.test.ts
          scripts/content-automator/youtubeTrendSource.test.ts
          scripts/content-automator/instagramTrendSource.test.ts
          scripts/content-automator/multiTrendSource.test.ts
          scripts/content-automator/rendering.test.ts
          scripts/content-automator/elevenLabsTts.test.ts
          scripts/content-automator/elevenLabsVideo.test.ts
          scripts/content-automator/qualityReviewer.test.ts
          scripts/content-automator/performance.test.ts
          scripts/content-automator/uiRender/uiRender.test.ts
          scripts/content-automator/uiRender/planIntegration.test.ts
          scripts/content-automator/mediaRender.test.ts

      - name: Install Playwright Chromium
        run: pnpm --dir artifacts/SpecSmith exec playwright install --with-deps chromium

      - name: Ensure FFmpeg is available
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Typecheck SpecSmith
        run: pnpm --dir artifacts/SpecSmith typecheck

      - name: Build SpecSmith
        run: pnpm --dir artifacts/SpecSmith build

      - name: Validate live ElevenLabs TTS
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          if [ -n "$ELEVENLABS_API_KEY" ]; then
            pnpm --dir artifacts/SpecSmith content:tts:smoke
          else
            echo "ELEVENLABS_API_KEY is not available in this workflow context; skipping live TTS smoke test."
          fi

      # Video generation is intentionally NOT called in normal CI because each
      # successful generation spends paid credits. The adapter/API lifecycle is
      # covered with mocked contract tests above; use content:video:smoke only
      # when a deliberate paid live test is wanted.

      - name: Validate live configured audio trend sources
        env:
          YOUTUBE_DATA_API_KEY: ${{ secrets.YOUTUBE_DATA_API_KEY }}
          BUNDLE_SOCIAL_API_KEY: ${{ secrets.BUNDLE_SOCIAL_API_KEY }}
        run: |
          if [ -n "$YOUTUBE_DATA_API_KEY" ] || [ -n "$BUNDLE_SOCIAL_API_KEY" ]; then
            pnpm --dir artifacts/SpecSmith content:trends:refresh
          else
            echo "No live audio trend source secrets are available in this workflow context; skipping live smoke test."
          fi

      - name: Generate real daily five
        env:
          YOUTUBE_DATA_API_KEY: ${{ secrets.YOUTUBE_DATA_API_KEY }}
          BUNDLE_SOCIAL_API_KEY: ${{ secrets.BUNDLE_SOCIAL_API_KEY }}
        run: pnpm --dir artifacts/SpecSmith content:strategist

      - name: Execute rendering dry run
        run: pnpm --dir artifacts/SpecSmith content:render:dry-run

      - name: Serve production build
        run: |
          npx --yes serve artifacts/SpecSmith/dist/public -l 5178 --no-clipboard &
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://localhost:5178/; then echo "server up"; exit 0; fi
            sleep 1
          done
          echo "static server did not come up" >&2
          exit 1

      - name: Deterministic UI smoke render
        env:
          SPECSMITH_RENDER_BASE_URL: http://localhost:5178
        run: pnpm --dir artifacts/SpecSmith content:render:ui-smoke

      - name: Package rendered UI artifacts
        if: always()
        run: |
          if [ -d artifacts/SpecSmith/render-output/ui-smoke ]; then
            tar -czf artifacts/SpecSmith/render-output/deterministic-ui-renders.tar.gz \
              -C artifacts/SpecSmith/render-output ui-smoke
          fi

      - name: Upload rendered UI artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deterministic-ui-renders
          path: artifacts/SpecSmith/render-output/deterministic-ui-renders.tar.gz
          if-no-files-found: warn
          retention-days: 14

      - name: Render real MP4 compositor smoke
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          SPECSMITH_RENDER_BASE_URL: http://localhost:5178
        run: |
          if [ -n "$ELEVENLABS_API_KEY" ]; then
            pnpm --dir artifacts/SpecSmith content:render:mp4-smoke
          else
            echo "ELEVENLABS_API_KEY is unavailable; skipping real MP4 smoke because fake narration is not an acceptable substitute."
          fi

      - name: Upload real MP4 smoke
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-mp4-compositor-smoke
          path: artifacts/SpecSmith/render-output/mp4-smoke/*.mp4
          if-no-files-found: warn
          retention-days: 14
