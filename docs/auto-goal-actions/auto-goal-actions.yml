# EXPERIMENTAL TEMPLATE ONLY. This file is deliberately outside .github/workflows.
# Do not install or enable it before an independent review and a tested account setup.
name: Auto Goal Actions executor (disabled design)

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Existing scoped Auto Goal issue number
        required: true
        type: number

permissions: {}

jobs:
  implement:
    if: ${{ false && github.ref == 'refs/heads/main' }} # Deliberately inert, even if copied into .github/workflows.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      # This is a proposed tool configuration, not a proven restriction of the hosted action.
      # The checked-out .claude/ configuration and action setup must be audited before enabling.
      - uses: anthropics/claude-code-action@34968b5981d5d170904281aa3df6f3c0d4a28855 # v1 tag target on 2026-10-14; audit before enabling
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: 'Implement the scoped issue. Edit source files only. Do not run code or publish.'
          claude_args: '--allowedTools "Read,Edit,MultiEdit,Glob,Grep" --disallowedTools "Bash,WebFetch,WebSearch"'
      - name: Export a narrow, text-only patch
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git ls-files --others --exclude-standard)"
          git diff --binary > "$RUNNER_TEMP/proposal.patch"
          node docs/auto-goal-actions/validate-proposal.mjs "$RUNNER_TEMP/proposal.patch" > "$RUNNER_TEMP/proposal.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 tag target on 2026-10-14
        with:
          name: proposed-diff
          path: |
            ${{ runner.temp }}/proposal.patch
            ${{ runner.temp }}/proposal.json
          if-no-files-found: error

  check:
    if: ${{ false && github.ref == 'refs/heads/main' }} # Deliberately inert.
    needs: implement
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4 tag target on 2026-10-14
        with:
          name: proposed-diff
          path: ${{ runner.temp }}/diff
      - name: Validate and apply the proposed diff
        shell: bash
        run: |
          set -euo pipefail
          node docs/auto-goal-actions/validate-proposal.mjs "$RUNNER_TEMP/diff/proposal.patch"
          git apply --check "$RUNNER_TEMP/diff/proposal.patch"
          git apply "$RUNNER_TEMP/diff/proposal.patch"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm
      # The proposed code is executed only in this job. It has no added secrets or write scopes.
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm --dir artifacts/SpecSmith exec vitest run
      - run: pnpm --dir artifacts/SpecSmith build
      - name: Bind successful checks to the exact patch bytes
        shell: bash
        run: |
          set -euo pipefail
          node docs/auto-goal-actions/record-checked.mjs "$RUNNER_TEMP/diff/proposal.patch" "$(git rev-parse HEAD)" > "$RUNNER_TEMP/checked.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 tag target on 2026-10-14
        with:
          name: checked-diff-hash
          path: ${{ runner.temp }}/checked.json
          if-no-files-found: error

  publish:
    if: ${{ false && github.ref == 'refs/heads/main' }} # Deliberately inert.
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4 tag target on 2026-10-14
        with:
          name: proposed-diff
          path: ${{ runner.temp }}/diff
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4 tag target on 2026-10-14
        with:
          name: checked-diff-hash
          path: ${{ runner.temp }}/checked
      - name: Refuse if patch bytes differ from successful check
        shell: bash
        run: |
          set -euo pipefail
          node docs/auto-goal-actions/verify-checked.mjs "$RUNNER_TEMP/diff/proposal.patch" "$RUNNER_TEMP/checked/checked.json" "$(git rev-parse HEAD)"
          git apply --check "$RUNNER_TEMP/diff/proposal.patch"
      # No generated code is executed in this job. Branch rules must independently prevent merge.
      - name: Publish an isolated draft branch
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ inputs.issue_number }}
        shell: bash
        run: |
          set -euo pipefail
          git apply "$RUNNER_TEMP/diff/proposal.patch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- artifacts/SpecSmith/src
          git commit -m "Draft Auto Goal proposal for issue #${ISSUE}"
          branch="claude/auto-goal-proposal-${GITHUB_RUN_ID}"
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push origin "HEAD:refs/heads/${branch}"
          gh pr create --draft --base main --head "$branch" --title "Auto Goal proposal for #${ISSUE}" --body "Experimental proposal from issue #${ISSUE}. Tested diff bound to this workflow run. Human review required."
