kind = "web"
previewPath = "/"
title = "Specsmith"
version = "1.0.0"
id = "artifacts/frameforge"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25360

[services.development]
run = "pnpm --filter @workspace/frameforge run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/frameforge", "run", "build" ]
publicDir = "artifacts/frameforge/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25360"
BASE_PATH = "/"
