<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>PC scene — stylised illustration</title>
<style>
  /* A STYLISED ILLUSTRATION assembled from CSS boxes. There is no 3D model
     behind it and no 3D engine in this repository. It shows a generic tower
     with no brand marks, no model numbers and no readable labels, and it makes
     no claim about airflow, temperature or cooling: the fans turn because fans
     turn, not because anything was simulated. */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; }
  body { background: #04040A; font-family: Arial, Helvetica, sans-serif; }

  .stage { position: absolute; inset: 0; perspective: 2000px; perspective-origin: 50% 46%; overflow: hidden; }

  .backdrop {
    position: absolute; inset: 0;
    background:
      radial-gradient(130% 62% at 50% 34%, #262640 0%, #14141F 46%, #08080F 78%, #04040A 100%);
  }
  .keylight {
    position: absolute; left: 4%; top: 10%; width: 62%; height: 62%;
    background: radial-gradient(closest-side, rgba(150,160,255,0.16), rgba(0,0,0,0));
    filter: blur(40px);
  }
  .contact {
    position: absolute; left: 50%; top: 73.5%; width: 760px; height: 150px;
    transform: translate(-50%,-50%);
    background: radial-gradient(50% 50% at 50% 50%, rgba(0,0,0,0.85), rgba(0,0,0,0) 70%);
    filter: blur(18px);
  }
  .floorglow {
    position: absolute; left: 50%; top: 70%; width: 1400px; height: 620px;
    transform: translate(-50%,0);
    background: radial-gradient(52% 46% at 50% 8%, rgba(130,100,255,0.40), rgba(0,0,0,0) 72%);
    filter: blur(30px);
  }

  .rig { position: absolute; left: 50%; top: 46%; transform-style: preserve-3d; }
  .box { position: absolute; transform-style: preserve-3d; }
  .face { position: absolute; left: 50%; top: 50%; transform-style: preserve-3d; }

  .metal {
    background: linear-gradient(152deg, #35364A 0%, #22232F 42%, #15161F 100%);
    border: 1px solid rgba(255,255,255,0.10);
  }
  .metal-dark { background: linear-gradient(160deg, #24252F, #121219); border: 1px solid rgba(255,255,255,0.06); }

  .glass {
    background: linear-gradient(148deg, rgba(175,195,255,0.20) 0%, rgba(110,130,200,0.09) 38%, rgba(190,205,255,0.07) 100%);
    border: 1px solid rgba(190,210,255,0.30);
  }
  .glass::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(118deg, rgba(255,255,255,0.26) 0%, rgba(255,255,255,0.02) 30%, rgba(255,255,255,0) 60%);
  }

  .mesh::before {
    content: ""; position: absolute; inset: 20px;
    background-image: radial-gradient(rgba(255,255,255,0.16) 1.3px, rgba(0,0,0,0) 1.4px);
    background-size: 12px 12px; border-radius: 6px;
  }

  /* interior ------------------------------------------------------------- */
  .mobo { background: linear-gradient(168deg, #1A1B28, #0E0F17); border: 1px solid rgba(255,255,255,0.07); }
  .trace { position: absolute; background: rgba(120,140,220,0.16); }
  .chip { position: absolute; background: linear-gradient(150deg, #2C2D3D, #181924); border: 1px solid rgba(255,255,255,0.09); border-radius: 6px; }
  .gpu { position: absolute; background: linear-gradient(175deg, #2A2B3B 0%, #17182100 4%, #171821 100%); border: 1px solid rgba(255,255,255,0.12); border-radius: 8px; }
  .gpu-strip { position: absolute; left: 16px; right: 16px; top: 14px; height: 9px; border-radius: 5px; }
  .ram { position: absolute; background: linear-gradient(180deg, #282938, #14151E); border: 1px solid rgba(255,255,255,0.10); border-radius: 4px; }
  .ram-top { position: absolute; left: 3px; right: 3px; top: 5px; height: 30px; border-radius: 3px; }

  /* fans ----------------------------------------------------------------- */
  .fan { position: absolute; }
  .fan-frame { position: absolute; inset: 0; border-radius: 18px; background: linear-gradient(145deg, #2B2C3C, #151621); border: 1px solid rgba(255,255,255,0.10); }
  .fan-rgb { position: absolute; inset: 8px; border-radius: 50%; border: 5px solid transparent; }
  .blades { position: absolute; inset: 16px; border-radius: 50%; }
  .blade {
    position: absolute; left: 50%; top: 50%; width: 44%; height: 30%;
    transform-origin: 0% 50%;
    background: linear-gradient(90deg, rgba(190,198,225,0.62), rgba(95,102,130,0.14));
    border-radius: 0 60% 60% 0;
  }
  .hub { position: absolute; left: 50%; top: 50%; width: 32%; height: 32%; transform: translate(-50%,-50%); border-radius: 50%;
         background: radial-gradient(circle at 34% 28%, #3A3B50, #161722); border: 1px solid rgba(255,255,255,0.12); }

  .label {
    position: absolute; left: 0; right: 0; bottom: 56px; text-align: center;
    font-size: 25px; letter-spacing: 0.14em; text-transform: uppercase;
    color: rgba(255,255,255,0.45); font-weight: 700;
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="backdrop"></div>
    <div class="keylight"></div>
    <div class="contact" id="contact"></div>
    <div class="floorglow" id="floorglow"></div>
    <div class="rig" id="rig"></div>
    <div class="label">Stylised illustration &middot; not a real product</div>
  </div>

<script>
(function () {
  var W = 430, H = 820, D = 470;   // case width, height, depth
  var rig = document.getElementById('rig');

  function node(cls, css, parent) {
    var d = document.createElement('div');
    d.className = cls;
    if (css) d.setAttribute('style', css);
    (parent || rig).appendChild(d);
    return d;
  }
  /** A face of the box, centred on the rig origin then pushed into place. */
  function face(cls, w, h, transform, parent) {
    return node('face ' + cls,
      'width:' + w + 'px; height:' + h + 'px; margin-left:' + (-w / 2) + 'px; margin-top:' + (-h / 2) +
      'px; transform:' + transform + ';', parent);
  }

  // Shell. Front (+Z) carries the intake fans; right (+X) is the glass panel.
  face('metal-dark', W, H, 'translateZ(' + (-D / 2) + 'px) rotateY(180deg)');              // back
  face('metal', W, D, 'rotateX(90deg) translateZ(' + (H / 2) + 'px)');                     // top
  face('metal-dark', W, D, 'rotateX(-90deg) translateZ(' + (H / 2) + 'px)');               // bottom
  face('glass', D, H, 'rotateY(-90deg) translateZ(' + (W / 2) + 'px)');                    // camera-side glass
  face('metal-dark', D, H, 'rotateY(90deg) translateZ(' + (W / 2) + 'px)');                // far side (solid)
  var frontFace = face('metal mesh', W, H, 'translateZ(' + (D / 2) + 'px)');               // front
  // Motherboard sits parallel to the far panel, facing the glass.
  var interior = face('', D - 150, H - 190, 'rotateY(90deg) translateZ(' + (W / 2 - 34) + 'px)');

  // Motherboard and parts, mounted on the inner plane.
  var mobo = node('mobo', 'position:absolute; inset:0; border-radius:8px;', interior);
  for (var tr = 0; tr < 7; tr++) {
    node('trace', 'left:' + (18 + tr * 38) + 'px; top:24px; width:2px; height:' + (120 + (tr % 3) * 70) + 'px;', mobo);
  }
  node('chip', 'left:96px; top:150px; width:132px; height:132px;', mobo);
  for (var r = 0; r < 4; r++) {
    var ram = node('ram', 'left:' + (18 + r * 30) + 'px; top:80px; width:22px; height:230px;', mobo);
    node('ram-top rgbfill', '', ram);
  }
  // GPU stands proud of the board, toward the glass.
  var gpu = face('gpu', D - 200, 120,
    'rotateY(90deg) translateZ(' + (W / 2 - 118) + 'px) translateY(' + (H / 2 - 300) + 'px)');
  node('gpu-strip rgbfill', '', gpu);

  // Three intake fans, children of the front face so they sit in its plane.
  var fans = [];
  for (var i = 0; i < 3; i++) {
    var f = node('fan', 'left:' + ((W - 210) / 2) + 'px; top:' + (90 + i * 232) + 'px; width:210px; height:210px;', frontFace);
    node('fan-frame', '', f);
    node('fan-rgb rgbborder', '', f);
    var blades = node('blades', '', f);
    for (var b = 0; b < 9; b++) node('blade', 'transform: rotate(' + (b * 40) + 'deg) translateX(5px);', blades);
    node('hub', '', f);
    fans.push(blades);
  }

  var rgbFills = document.querySelectorAll('.rgbfill');
  var rgbBorders = document.querySelectorAll('.rgbborder');
  var floorglow = document.getElementById('floorglow');

  function clamp01(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }
  function easeInOut(v) { return v < 0.5 ? 2 * v * v : 1 - Math.pow(-2 * v + 2, 2) / 2; }

  window.renderFrame = function (t) {
    t = clamp01(t);
    var e = easeInOut(t);

    // One deliberate arc: starts three-quarter front-right, swings to show the
    // glass side, easing at both ends, pushing in slightly.
    var yaw = 42 - e * 34;
    var pitch = 10 - e * 7;
    var dolly = -330 + e * 190;
    rig.setAttribute('style',
      'transform: translate(-50%,-50%) translateZ(' + dolly.toFixed(2) + 'px) rotateX(' +
      pitch.toFixed(2) + 'deg) rotateY(' + yaw.toFixed(2) + 'deg);');

    // Fans spin up and hold. Angle is the integral of the ramp, so no jumps.
    var spin = clamp01((t - 0.10) / 0.36);
    var se = easeInOut(spin);
    var revs = se * se * 1.15 + Math.max(0, t - 0.46) * 5.6;
    for (var k = 0; k < fans.length; k++) {
      fans[k].setAttribute('style', 'transform: rotate(' + (revs * 360 + k * 14).toFixed(2) + 'deg);');
    }

    // RGB comes up, then drifts through hue.
    var lit = easeInOut(clamp01((t - 0.20) / 0.30));
    var hue = 258 + t * 120;
    var colour = 'hsl(' + hue.toFixed(1) + ', 95%, 64%)';
    var soft = 'hsla(' + hue.toFixed(1) + ', 95%, 64%, ' + (0.6 * lit).toFixed(3) + ')';

    for (var m = 0; m < rgbFills.length; m++) {
      rgbFills[m].setAttribute('style',
        'background:' + colour + '; opacity:' + lit.toFixed(3) + '; box-shadow: 0 0 30px 8px ' + soft + ';');
    }
    for (var n = 0; n < rgbBorders.length; n++) {
      rgbBorders[n].setAttribute('style',
        'border-color:' + colour + '; opacity:' + (lit * 0.95).toFixed(3) +
        '; box-shadow: 0 0 34px 6px ' + soft + ', inset 0 0 22px 3px ' + soft + ';');
    }
    floorglow.style.opacity = (0.28 + 0.72 * lit).toFixed(3);
    floorglow.style.filter = 'blur(30px) hue-rotate(' + (hue - 258).toFixed(1) + 'deg)';
  };

  window.renderFrame(0);
})();
</script>
</body>
</html>
